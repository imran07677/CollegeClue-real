{% extends "base.html" %}

{% block title %}Logged Out - College Clue{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4 p-5">
                <div class="mb-3 text-success">
                    <i class="bi bi-check-circle-fill display-4"></i>
                </div>
                <h3 class="fw-bold mb-3">Logged Out</h3>
                <p class="text-muted mb-4">You have been successfully logged out of your College Clue account.</p>
                <div>
                    <a href="{% url 'login' %}" class="btn btn-primary px-4 me-2">Log In Again</a>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary px-4">Return Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
